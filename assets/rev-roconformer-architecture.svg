<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Rev-RoConformer architecture</title>
<desc id="desc">Speech waveform enters an acoustic frontend and subsampling stage, then a reversible block splits channels into x1 and x2. F contains RoPE global self-attention and FFN, G contains local Conformer convolution and FFN. The two branches are additively coupled and repeated across depth before CTC or decoder heads.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#102a43"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9fb3c8"/></marker>
</defs>
<rect width="1400" height="900" fill="url(#bg)"/>
<text x="700" y="62" text-anchor="middle" fill="#ecfeff" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">Rev‑RoConformer ASR Encoder</text>
<text x="700" y="100" text-anchor="middle" fill="#9fb3c8" font-family="Inter,Segoe UI,sans-serif" font-size="18">Global context ⊕ rotary geometry ⊕ local acoustics ⊕ reversible depth</text>

<g filter="url(#shadow)" font-family="Inter,Segoe UI,sans-serif">
  <rect x="70" y="180" width="190" height="82" rx="18" fill="#10243a" stroke="#36566f"/>
  <text x="165" y="214" text-anchor="middle" fill="#eaf2f8" font-size="20" font-weight="700">🎤 Waveform</text>
  <text x="165" y="242" text-anchor="middle" fill="#9fb3c8" font-size="15">16 kHz mono</text>

  <rect x="315" y="180" width="220" height="82" rx="18" fill="#10243a" stroke="#36566f"/>
  <text x="425" y="214" text-anchor="middle" fill="#eaf2f8" font-size="20" font-weight="700">Acoustic frontend</text>
  <text x="425" y="242" text-anchor="middle" fill="#9fb3c8" font-size="15">80-bin log-Mel</text>

  <rect x="590" y="180" width="210" height="82" rx="18" fill="#10243a" stroke="#36566f"/>
  <text x="695" y="214" text-anchor="middle" fill="#eaf2f8" font-size="20" font-weight="700">Subsampling</text>
  <text x="695" y="242" text-anchor="middle" fill="#9fb3c8" font-size="15">Conv ×4 / ×8</text>

  <line x1="260" y1="221" x2="315" y2="221" stroke="#9fb3c8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="535" y1="221" x2="590" y2="221" stroke="#9fb3c8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="800" y1="221" x2="880" y2="221" stroke="#9fb3c8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="880" y="145" width="450" height="565" rx="28" fill="#0b1c2d" stroke="#2f6079" stroke-width="2"/>
  <text x="1105" y="188" text-anchor="middle" fill="#ecfeff" font-size="25" font-weight="700">♻ Reversible block × L</text>
  <text x="1105" y="216" text-anchor="middle" fill="#9fb3c8" font-size="14">split hidden channels → additive coupling → reconstruct in backward</text>

  <rect x="930" y="255" width="150" height="60" rx="14" fill="#142b43" stroke="#4a6b85"/>
  <text x="1005" y="291" text-anchor="middle" fill="#eaf2f8" font-size="21" font-weight="700">x₁</text>
  <rect x="1130" y="255" width="150" height="60" rx="14" fill="#142b43" stroke="#4a6b85"/>
  <text x="1205" y="291" text-anchor="middle" fill="#eaf2f8" font-size="21" font-weight="700">x₂</text>

  <rect x="1050" y="355" width="230" height="104" rx="18" fill="url(#blue)"/>
  <text x="1165" y="390" text-anchor="middle" fill="white" font-size="20" font-weight="700">F(x₂)</text>
  <text x="1165" y="418" text-anchor="middle" fill="#eaf2ff" font-size="15">Norm → RoPE MHSA</text>
  <text x="1165" y="440" text-anchor="middle" fill="#eaf2ff" font-size="15">→ ½ FFN</text>

  <rect x="930" y="500" width="210" height="78" rx="16" fill="#14314a" stroke="#4a7b9b"/>
  <text x="1035" y="533" text-anchor="middle" fill="#eaf2f8" font-size="18" font-weight="700">y₁ = x₁ + F(x₂)</text>
  <text x="1035" y="558" text-anchor="middle" fill="#9fb3c8" font-size="14">global branch</text>

  <rect x="1090" y="500" width="190" height="104" rx="18" fill="url(#teal)"/>
  <text x="1185" y="535" text-anchor="middle" fill="white" font-size="20" font-weight="700">G(y₁)</text>
  <text x="1185" y="562" text-anchor="middle" fill="#eafffb" font-size="15">Norm → DW Conv</text>
  <text x="1185" y="584" text-anchor="middle" fill="#eafffb" font-size="15">→ ½ FFN</text>

  <rect x="930" y="625" width="350" height="60" rx="16" fill="#14314a" stroke="#4a7b9b"/>
  <text x="1105" y="662" text-anchor="middle" fill="#eaf2f8" font-size="18" font-weight="700">y₂ = x₂ + G(y₁)</text>

  <line x1="1205" y1="315" x2="1205" y2="355" stroke="#9fb3c8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1050" y1="407" x2="1015" y2="407" stroke="#9fb3c8" stroke-width="3"/>
  <line x1="1015" y1="407" x2="1015" y2="500" stroke="#9fb3c8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1005" y1="315" x2="1005" y2="500" stroke="#9fb3c8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1140" y1="539" x2="1090" y2="539" stroke="#9fb3c8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1205" y1="315" x2="1298" y2="315" stroke="#9fb3c8" stroke-width="3"/>
  <line x1="1298" y1="315" x2="1298" y2="655" stroke="#9fb3c8" stroke-width="3"/>
  <line x1="1298" y1="655" x2="1280" y2="655" stroke="#9fb3c8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="390" y="390" width="310" height="98" rx="18" fill="#10243a" stroke="#36566f"/>
  <text x="545" y="426" text-anchor="middle" fill="#eaf2f8" font-size="19" font-weight="700">Inverse reconstruction</text>
  <text x="545" y="453" text-anchor="middle" fill="#64d8cb" font-size="17">x₂ = y₂ − G(y₁)</text>
  <text x="545" y="477" text-anchor="middle" fill="#64d8cb" font-size="17">x₁ = y₁ − F(x₂)</text>
  <line x1="700" y1="439" x2="880" y2="439" stroke="#64d8cb" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/>

  <rect x="385" y="610" width="180" height="70" rx="16" fill="#10243a" stroke="#36566f"/>
  <text x="475" y="641" text-anchor="middle" fill="#eaf2f8" font-size="18" font-weight="700">CTC head</text>
  <text x="475" y="664" text-anchor="middle" fill="#9fb3c8" font-size="14">alignment path</text>

  <rect x="610" y="610" width="210" height="70" rx="16" fill="#10243a" stroke="#36566f"/>
  <text x="715" y="641" text-anchor="middle" fill="#eaf2f8" font-size="18" font-weight="700">AED / Transducer</text>
  <text x="715" y="664" text-anchor="middle" fill="#9fb3c8" font-size="14">decoder path</text>

  <rect x="475" y="745" width="250" height="78" rx="18" fill="#173554" stroke="#4a7b9b"/>
  <text x="600" y="778" text-anchor="middle" fill="#ecfeff" font-size="20" font-weight="700">📝 Transcript</text>
  <text x="600" y="804" text-anchor="middle" fill="#9fb3c8" font-size="14">Speech → Text</text>

  <line x1="880" y1="680" x2="820" y2="645" stroke="#9fb3c8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="820" y1="645" x2="820" y2="645" stroke="#9fb3c8" stroke-width="3"/>
  <line x1="565" y1="680" x2="565" y2="725" stroke="#9fb3c8" stroke-width="3"/>
  <line x1="715" y1="680" x2="715" y2="725" stroke="#9fb3c8" stroke-width="3"/>
  <line x1="565" y1="725" x2="600" y2="745" stroke="#9fb3c8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="715" y1="725" x2="635" y2="745" stroke="#9fb3c8" stroke-width="3" marker-end="url(#arrow)"/>
</g>

<text x="70" y="865" fill="#9fb3c8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Key claim: reversibility targets activation memory across depth; it does not remove O(T²) dense-attention arithmetic.</text>
</svg>
